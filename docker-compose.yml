version: '3.8'

services:
  web_replica_1:
    build: ./app
    container_name: web_replica_1

  web_replica_2:
    build: ./app
    container_name: web_replica_2

  web_replica_3:
    build: ./app
    container_name: web_replica_3

  lb:
    image: nginx:latest
    container_name: nginx_lb
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "80:80"
    depends_on:
      - web_replica_1
      - web_replica_2
      - web_replica_3
